# Proxy da API NVIDIA para o app "Remédio na Hora" (deploy separado do Pages).
# Configure com `npx wrangler`:
#   npx wrangler secret put NVIDIA_API_KEY   # chave nvapi-... (obrigatória)
#   npx wrangler deploy

name = "remedios-ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-11-13"

# Banco técnico do Web Push: somente inscrições e horários UTC, sem dados clínicos.
[[d1_databases]]
binding = "PUSH_DB"
database_name = "remedios-push"
database_id = "c36f1475-4259-4c86-8d23-afb5fef066ed"

[triggers]
crons = ["* * * * *"]

[vars]
# Origens autorizadas a chamar o proxy (CORS, exact match, separadas por vírgula).
# CONFIRME o endereço real do seu Pages após o deploy:
# https://alexsantossp71-lgtm.github.io  (cobre /remedios_app/)
ALLOWED_ORIGINS = "https://alexsantossp71-lgtm.github.io,http://localhost:5173,http://127.0.0.1:5173"

# Modelos que o proxy aceita (protege contra uso arbitrário da chave).
# Lista curada de modelos NVIDIA para texto e visão. O app consulta /models e
# tenta automaticamente o próximo modelo compatível quando um endpoint falha.
# Evite '*' no proxy público para não permitir uso arbitrário da chave.
ALLOWED_MODELS = "z-ai/glm-5.3-flash,stepfun-ai/step-5-preview,meta/muse-glimmer-30b,nvidia/nemotron-3.5-super-vl-120b-a12b,nvidia/nemotron-3.5-lightning-30b-a3b,meta/llama-3.2-90b-vision-instruct,meta/llama-3.2-11b-vision-instruct"

# Chave pública VAPID (não é segredo; a privada fica em VAPID_PRIVATE_KEY).
VAPID_PUBLIC_KEY = "BAjbR16MfNGcHnruGzW1fhYem5k4Dk1VvxT5jj7qZjui6C5DDFnfZY_sz-EtKEgTMeHlc0OvWGtTYJAVafzGSQs"

# Rate limit: 30 pedidos por IP a cada 5 minutos; 200 por IP por dia.
RATE_LIMIT_WINDOW_MS = "300000"
RATE_LIMIT_MAX = "30"
RATE_LIMIT_DAY_MAX = "200"

# SEGREDOS (não definidos aqui):
#   NVIDIA_API_KEY — obrigatória (nvapi-... da sua conta build.nvidia.com)
#   VAPID_PRIVATE_KEY — chave privada VAPID em Base64URL (32 bytes), já cadastrada no Worker
# A API é protegida por allowlist de origem, allowlist de modelos e limites por IP.
# NVIDIA_API_KEY permanece exclusivamente como secret do Worker.

# Provedor experimental: só será usado pelas rotas /v1/pollinations/*.
# A chave POLLINATIONS_API_KEY deve ser cadastrada como secret no Cloudflare.
POLLINATIONS_ALLOWED_MODELS = "google/gemini-3.8-flash,openai/gpt-5.4-nano,deepseek/deepseek-v4-flash,qwen/qwen3.8-27b"
