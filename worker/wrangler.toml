# Proxy da API NVIDIA para o app "Remédio na Hora" (deploy separado do Pages).
# Configure com `npx wrangler`:
#   npx wrangler secret put NVIDIA_API_KEY   # chave nvapi-... (obrigatória)
#   npx wrangler secret put PROXY_TOKEN      # obrigatório: token privado para cada chamada
#   npx wrangler deploy

name = "remedios-ai-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
# Origens autorizadas a chamar o proxy (CORS, exact match, separadas por vírgula).
# CONFIRME o endereço real do seu Pages após o deploy:
# https://alexsantossp71-lgtm.github.io  (cobre /remedios_app/)
ALLOWED_ORIGINS = "https://alexsantossp71-lgtm.github.io,http://localhost:5173,http://127.0.0.1:5173"

# Modelos que o proxy aceita (protege contra uso arbitrário da chave).
# Use '*' para liberar todos os modelos da sua conta.
ALLOWED_MODELS = "meta/llama-3.3-70b-instruct,meta/llama-3.2-90b-vision-instruct,meta/llama-3.2-11b-vision-instruct"

# Rate limit: 30 pedidos por IP a cada 5 minutos; 200 por IP por dia.
RATE_LIMIT_WINDOW_MS = "300000"
RATE_LIMIT_MAX = "30"
RATE_LIMIT_DAY_MAX = "200"

# SEGREDOS (não definidos aqui):
#   NVIDIA_API_KEY — obrigatória (nvapi-... da sua conta build.nvidia.com)
#   PROXY_TOKEN    — obrigatório; o app deve enviar o mesmo valor no campo
#                    "Token do proxy" das Configurações. Nunca coloque esse valor
#                    em arquivos do repositório ou no bundle público do frontend.
