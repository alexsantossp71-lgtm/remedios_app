name: Regenerate pnpm lockfile

on:
  push:
    branches:
      - maintenance/regenerate-pnpm-lock

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/regenerate-pnpm-lock
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile from manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already matches package manifests."
          else
            git commit -m "chore: regenerate pnpm lockfile [skip ci]"
            git push
          fi
