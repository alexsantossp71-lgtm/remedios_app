name: Deploy AI Proxy (Cloudflare Worker)

# Deploy do proxy de IA para o Cloudflare, sem terminal local.
# Requer estes secrets no repositório (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   — token com permissão de editar Workers
#   CLOUDFLARE_ACCOUNT_ID  — Account ID do painel do Cloudflare
#   NVIDIA_API_KEY         — chave nvapi- da NVIDIA

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-proxy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar secrets obrigatórios
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NVIDIA_API_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret obrigatório ausente: $name"; missing=1; fi
          done
          exit "$missing"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy do Worker (código + configurações)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy

      - name: Publicar o secret NVIDIA_API_KEY no Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "::error::Secret NVIDIA_API_KEY ausente no repositório GitHub."
            exit 1
          fi
          printf '%s' "$NVIDIA_API_KEY" | npx wrangler@4 secret put NVIDIA_API_KEY

      - name: Resumo
        run: |
          echo "Worker deployado. Teste: curl https://remedios-ai-proxy.<sua-conta>.workers.dev/health"
          echo "Confira a URL exata em: dash.cloudflare.com → Workers & Pages → remedios-ai-proxy"
